version: v2
clean: true
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/googleapis/googleapis
  override:
    - file_option: go_package_prefix
      value: github.com/darmawan01/interchange/errors/gen/go
plugins:
  # Pinned to the same protobuf runtime the core module requires; a plugin
  # newer than the runtime emits code the runtime cannot load.
  - local: bin/protoc-gen-go
    out: errors/gen/go
    opt: [paths=source_relative]
