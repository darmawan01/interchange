syntax = "proto3";

// One annotated RPC beside one that forgot -- the half-annotated service the
// build gate exists to catch.
package interchange.authtest.bad.v1;

import "interchange/auth/v1/auth.proto";

// Every real contract carries one -- buf's managed mode sets it -- and
// protoc-gen-authz refuses a file without one, so the fixtures carry one too.
option go_package = "github.com/darmawan01/interchange/auth/internal/fixture/gen/authtest/bad/v1;badv1";

message BadRequest {
  string tenant_id = 1;
}

message BadResponse {
  string note = 1;
}

service BadService {
  rpc Annotated(BadRequest) returns (BadResponse) {
    option (interchange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_SESSION]
      permission: {resource: "bad" verb: VERB_READ}
    };
  }

  rpc Forgotten(BadRequest) returns (BadResponse) {}
}
