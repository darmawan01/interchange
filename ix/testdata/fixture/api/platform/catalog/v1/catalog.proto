syntax = "proto3";

// The describe fixture. Four RPCs, chosen to cover the four states the
// resolution can be in: fully annotated, unannotated, bus-only, and internal.
package platform.catalog.v1;

import "google/api/annotations.proto";
import "interchange/auth/v1/auth.proto";
import "interchange/cli/v1/cli.proto";
import "interchange/transport/v1/transports.proto";

service CatalogService {
  // ListProviders is the fully annotated case: five downstream artifacts
  // declared in one place.
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/catalog/providers"};
    option (interchange.transport.v1.transports) = {
      on: [TRANSPORT_RPC, TRANSPORT_REST, TRANSPORT_BUS]
      group: "catalog"
    };
    option (interchange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_SESSION, AUTH_TYPE_API_KEY, AUTH_TYPE_WORKLOAD]
      permission: {
        resource: "providers"
        verb: VERB_READ
      }
    };
    option (interchange.cli.v1.command) = {path: ["catalog", "providers"]};
  }

  // GetProvider carries no annotation at all: it must resolve to the
  // documented default, rpc + rest, with no authorization section.
  rpc GetProvider(GetProviderRequest) returns (GetProviderResponse) {}

  // ProviderChanged is bus-only. Nothing about it is reachable over HTTP,
  // which is exactly the property a reviewer wants to be able to see.
  rpc ProviderChanged(ProviderChangedRequest) returns (ProviderChangedResponse) {
    option (interchange.transport.v1.transports) = {
      on: [TRANSPORT_BUS]
      group: "catalog-events"
    };
  }

  // DrainProvider is internal: skipped by every public binding, mTLS-only.
  rpc DrainProvider(DrainProviderRequest) returns (DrainProviderResponse) {
    option (interchange.transport.v1.internal) = true;
    option (interchange.transport.v1.transports) = {on: [TRANSPORT_RPC]};
  }
}

// EventService sets a service-level default, which every method inherits
// unless it replaces it.
service EventService {
  option (interchange.transport.v1.service_transports) = {
    on: [TRANSPORT_BUS, TRANSPORT_MQTT]
    group: "events"
  };

  rpc Publish(PublishRequest) returns (PublishResponse) {}
}

message ListProvidersRequest {
  int32 page_size = 1;
  string page_token = 2;

  // Declared rather than merely conventional: the (tenant_id_field) option
  // is how an authz module finds the tenant by reflection when the field is
  // not named tenant_id.
  string tenant_id = 3 [(interchange.auth.v1.tenant_id_field) = true];
}

message ListProvidersResponse {
  repeated Provider providers = 1;
  string next_page_token = 2;
}

message GetProviderRequest {
  string provider_id = 1;
}

message GetProviderResponse {
  Provider provider = 1;
}

message ProviderChangedRequest {
  string provider_id = 1;
  string change = 2;
}

message ProviderChangedResponse {}

message DrainProviderRequest {
  string provider_id = 1;
}

message DrainProviderResponse {
  int32 drained = 1;
}

message PublishRequest {
  string topic = 1;
  bytes payload = 2;
}

message PublishResponse {
  string event_id = 1;
}

message Provider {
  string provider_id = 1;
  string display_name = 2;
}
