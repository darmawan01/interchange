syntax = "proto3";

// A minimal stand-in for google/api/annotations.proto, vendored so the
// fixture builds with no network and no registry dependency. The extension
// number and every field number match upstream, which is the part that
// matters: ix resolves (google.api.http) by number and reads it by field
// name, so this file exercises the same path a real googleapis import would.
package google.api;

import "google/protobuf/descriptor.proto";

message CustomHttpPattern {
  string kind = 1;
  string path = 2;
}

message HttpRule {
  string selector = 1;

  oneof pattern {
    string get = 2;
    string put = 3;
    string post = 4;
    string delete = 5;
    string patch = 6;
    CustomHttpPattern custom = 8;
  }

  string body = 7;
  repeated HttpRule additional_bindings = 11;
  string response_body = 12;
}

extend google.protobuf.MethodOptions {
  HttpRule http = 72295728;
}
